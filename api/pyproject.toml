[project]
name = "ai-router"
version = "1.0.0"
description = "AI message categorisation and routing PoC: FastAPI + Pydantic AI agent + Ollama + SMTP."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai]>=2.14,<3",
    "aiosmtplib>=3.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "asgi-lifespan>=2.1",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_router"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not integration and not llm and not e2e"]
markers = [
    "integration: needs running Mailpit/Ollama containers (docker compose up -d)",
    "llm: calls the real LLM through Ollama (slow, non-deterministic)",
    "e2e: end-to-end tests against the running stack (DoD)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["ai_router"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

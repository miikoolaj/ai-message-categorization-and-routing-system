- id: lo-03
  message: >-
    Dzień dobry, od kilku miesięcy mam coraz większy problem we współpracy z kierowniczką mojego
    zespołu. Na spotkaniach regularnie przerywa mi i komentuje moje pomysły w sposób, który odbieram
    jako lekceważący, a ostatnio przy klientach powiedziała, że "nie nadaję się do tej pracy".
    Próbowałem rozmawiać z nią w cztery oczy, ale sytuacja się nie zmieniła. Nie chcę na razie
    składać formalnej skargi, ale potrzebuję porady, jak to rozwiązać, i chętnie skorzystałbym
    z mediacji. Bardzo proszę o dyskrecję.
  expected: human-resources@example.com
  tags: [pl, long, holdout]
- id: lo-04
  message: >-
    Witam, od wczoraj mój laptop nie łączy się z siecią Wi-Fi w biurze - widzi sieć, ale po
    wpisaniu hasła pokazuje "brak internetu". Koledzy przy sąsiednich biurkach pracują normalnie,
    więc to chyba coś z moim komputerem. Kabel sieciowy też nie pomaga, a restart i aktualizacja
    sterowników nic nie dały. Pracuję teraz na telefonie jako hotspot, ale to bardzo niewygodne.
    Czy ktoś mógłby podejść do mojego stanowiska (pokój 214)?
  expected: help-desk@example.com
  tags: [pl, long, contrast]

# Labelled evaluation dataset for the routing agent.
#   expected   - the correct department according to the routing policy (routing/policy.yaml)
#   acceptable - other departments that are also defensible for genuinely ambiguous messages
#   tags       - language / category; "holdout" cases (~30%) must NOT be looked at while tuning the
#                prompt or the policy; "contrast" cases test the decision rules (one user vs many,
#                kadry vs HR, keywords used in a different context)
#
# The cases are DISJOINT from the few-shot examples in the policy: run_eval.py tags any overlap as
# "in-prompt" and reports the accuracy without those cases separately.
#
# Run: make eval   (or: make eval ARGS="--exclude-tags holdout")


# --- Long messages ---------------------------------------------------------------------------
- id: lo-01
  message: >-
    Dzień dobry, piszę w imieniu całego zespołu analityków. Od wczoraj po południu nikt z nas
    nie może połączyć się z firmowym VPN-em - klient VPN zgłasza błąd uwierzytelnienia, mimo że
    hasła są poprawne i działają w innych systemach. Problem dotyczy zarówno laptopów z Windows,
    jak i z macOS, w biurze i w domu. Sprawdziliśmy już restart komputerów, ponowną instalację
    klienta oraz inne sieci (Wi-Fi domowe, hotspot w telefonie) - bez zmian. Przez to nie mamy
    dostępu do hurtowni danych ani do raportów dla zarządu, które musimy oddać w piątek. Czy
    możecie sprawdzić, czy coś zmieniło się w konfiguracji serwera VPN albo w certyfikatach?
    Z góry dziękuję i proszę o informację, kiedy możemy spodziewać się rozwiązania.
  expected: it@example.com
  tags: [pl, long]
- id: lo-02
  message: >-
    Dzień dobry, chciałabym zaplanować urlop wypoczynkowy w okresie od 14 do 25 lipca. Zostało mi
    jeszcze 18 dni zaległego urlopu z poprzedniego roku i chciałabym wykorzystać je w pierwszej
    kolejności. Mój przełożony wstępnie zaakceptował termin, zastępstwo przejmie kolega z zespołu.
    Proszę o informację, czy muszę złożyć wniosek w systemie, czy wystarczy ta wiadomość, oraz
    czy zaległy urlop zostanie rozliczony przed bieżącym. Dziękuję.
  expected: kadry@example.com
  tags: [pl, long]

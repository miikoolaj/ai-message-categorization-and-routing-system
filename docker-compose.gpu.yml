# Optional NVIDIA GPU overlay (requires the NVIDIA Container Toolkit). The CPU default uses the
# small alpine/ollama image; GPUs need the full ollama/ollama image with CUDA libraries.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    image: ${OLLAMA_GPU_IMAGE:-ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
